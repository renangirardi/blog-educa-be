name: CI / CD (tests in containers + deploy to Render)

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (ensures docker compose/build works)
        uses: docker/setup-buildx-action@v3

      - name: Run tests via docker compose
        run: |
          # sobe db + app (app vai esperar o DB e rodar os testes)
          docker compose -f docker-compose.test.yml up --build --abort-on-container-exit
        # Se os testes falharem esse passo retorna non-zero e a job para aqui (o deploy não será acionado)

      - name: Tear down compose (always)
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans

  deploy:
    needs: build_and_test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.build_and_test.result == 'success'
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is not set - skipping deploy"
            exit 1
          fi
          echo "Calling Render deploy hook..."
          # POST simples para o webhook do Render
          curl -X POST --fail "$RENDER_DEPLOY_HOOK"
